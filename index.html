<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Collage</title>

<style>
body {
    margin: 0;
    background: linear-gradient(to bottom, #fceabb, #f8b500);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

/* Container */
.container {
    position: relative;
    width: 350px;
}

/* Photos */
.photo {
    width: 100%;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    margin-bottom: 20px;
    transition: 0.3s;
}

.photo:hover {
    transform: scale(1.05);
}

/* Rotate */
.rotate1 {
    transform: rotate(-5deg);
}
.rotate2 {
    transform: rotate(5deg);
}

/* Music card */
.music {
    position: absolute;
    top: 100px;
    left: 10px;
    background: #2c2c2c;
    color: white;
    padding: 10px;
    border-radius: 15px;
    width: 220px;
}

/* Small image */
.small {
    position: absolute;
    bottom: -30px;
    right: -20px;
    width: 100px;
    border-radius: 10px;
}

/* Flowers */
.flower {
    position: absolute;
    width: 40px;
}

.flower1 {
    top: -10px;
    left: -10px;
}
.flower2 {
    bottom: 0;
    right: -5px;
}
</style>

</head>

<body>

<div class="container">

    <!-- Main Images -->
    <img src="https://raw.githubusercontent.com/shirajmohd816-source/Babu/main/Snapchat-1033644591.jpg" class="photo rotate1">
    <img src="https://raw.githubusercontent.com/shirajmohd816-source/Babu/main/Snapchat-1033644591.jpg" class="photo rotate2">
    <img src="https://raw.githubusercontent.com/shirajmohd816-source/Babu/main/Snapchat-1033644591.jpg" class="photo">

    <!-- Music -->
    <div class="music">
        <p>🎵 Mahoor</p>
        <audio controls>
            <source src="https://raw.githubusercontent.com/earningtechgamer-gif/BABU-/main/Ishq%20Ki%20Saazishein%20Ishq%20Ki%20Baaziyaa%20Ringtone%20Download%20-%20MobCup.Com.Co.mp3" type="audio/mpeg">
        </audio>
    </div>

    <!-- Small Image -->
    <img src="https://raw.githubusercontent.com/shirajmohd816-source/Babu/main/Snapchat-1033644591.jpg" class="small">

    <!-- Flowers -->
    <img src="https://raw.githubusercontent.com/shirajmohd816-source/Khan/main/pngtree-blue-flower-and-gold-stripes-with-watercolor-style-png-image_6738279.png" class="flower flower1">
    <img src="https://raw.githubusercontent.com/shirajmohd816-source/Khan/main/pngtree-blue-flower-and-gold-stripes-with-watercolor-style-png-image_6738279.png" class="flower flower2">

</div>

</body>
</html>
